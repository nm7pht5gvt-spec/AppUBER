name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpieza y Mapeo Correcto de Código
        run: |
          # 1. Crear la estructura limpia y oficial de paquetes Android
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor

          # 2. Copiar únicamente los archivos reales .kt desde donde hayan quedado
          find app/src/main/java -name "*.kt" -exec cp {} clean_app/src/main/java/com/tuapp/tripadvisor/ \; 2>/dev/null || true
          find java/com/tuapp/tripadvisor -name "*.kt" -exec cp {} clean_app/src/main/java/com/tuapp/tripadvisor/ \; 2>/dev/null || true

          # Reorganizar paquetes específicos en sus subcarpetas correspondientes
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/ui/config
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/ui/overlay
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/ui/theme
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/domain/model
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/data/preferences
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/service/overlay
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/service/accessibility
          mkdir -p clean_app/src/main/java/com/tuapp/tripadvisor/util

          # Mover archivos a sus carpetas verdaderas
          mv clean_app/src/main/java/com/tuapp/tripadvisor/ConfigScreen.kt clean_app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/ConfigViewModel.kt clean_app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/PermissionDialogs.kt clean_app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/SemaphoreWidget.kt clean_app/src/main/java/com/tuapp/tripadvisor/ui/overlay/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/Theme.kt clean_app/src/main/java/com/tuapp/tripadvisor/ui/theme/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/TripOffer.kt clean_app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/TripEvaluation.kt clean_app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/TripEvaluator.kt clean_app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/UserPreferences.kt clean_app/src/main/java/com/tuapp/tripadvisor/data/preferences/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/PreferencesRepository.kt clean_app/src/main/java/com/tuapp/tripadvisor/data/preferences/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/OverlayService.kt clean_app/src/main/java/com/tuapp/tripadvisor/service/overlay/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/RideAccessibilityService.kt clean_app/src/main/java/com/tuapp/tripadvisor/service/accessibility/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/PermissionHelper.kt clean_app/src/main/java/com/tuapp/tripadvisor/util/ 2>/dev/null || true
          mv clean_app/src/main/java/com/tuapp/tripadvisor/ScreenTextParser.kt clean_app/src/main/java/com/tuapp/tripadvisor/util/ 2>/dev/null || true

          # Reemplazar carpeta de codigo 'app' desordenada por la limpia
          rm -rf app/src/main/java
          mkdir -p app/src/main
          mv clean_app/src/main/java app/src/main/
          rm -rf clean_app

      - name: Preparar Infraestructura de Gradle y Manifest
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppUBER"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.tuapp.tripadvisor"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tuapp.tripadvisor"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Semáforo de Viajes</string>
              <string name="accessibility_service_description">Servicio para monitorear viajes de Uber</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.accessibility.RideAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".service.overlay.OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Otorgar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
