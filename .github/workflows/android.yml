name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Rescatar archivos y aplanar estructura de proyecto
        run: |
          # 1. Crear directorio temporal para rescatar codigo
          mkdir -p /tmp/recovered_code

          # 2. Copiar todos los archivos fuente validos a la zona de rescate
          find . -name "*.kt" -exec cp {} /tmp/recovered_code/ \; 2>/dev/null || true

          # 3. Limpiar completamente el espacio de trabajo para eliminar carpetas anidadas
          rm -rf app java .github/workflows/app

          # 4. Crear estructura limpia y oficial de Android
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/ui/config
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/ui/overlay
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/ui/theme
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/domain/model
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/data/preferences
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/service/overlay
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/service/accessibility
          mkdir -p app/src/main/java/com/tuapp/tripadvisor/util
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # 5. Acomodar cada archivo .kt rescatado en su subcarpeta correspondiente
          cp /tmp/recovered_code/MainActivity.kt app/src/main/java/com/tuapp/tripadvisor/ 2>/dev/null || true
          cp /tmp/recovered_code/ConfigScreen.kt app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          cp /tmp/recovered_code/ConfigViewModel.kt app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          cp /tmp/recovered_code/PermissionDialogs.kt app/src/main/java/com/tuapp/tripadvisor/ui/config/ 2>/dev/null || true
          cp /tmp/recovered_code/SemaphoreWidget.kt app/src/main/java/com/tuapp/tripadvisor/ui/overlay/ 2>/dev/null || true
          cp /tmp/recovered_code/Theme.kt app/src/main/java/com/tuapp/tripadvisor/ui/theme/ 2>/dev/null || true
          cp /tmp/recovered_code/TripOffer.kt app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          cp /tmp/recovered_code/TripEvaluation.kt app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          cp /tmp/recovered_code/TripEvaluator.kt app/src/main/java/com/tuapp/tripadvisor/domain/model/ 2>/dev/null || true
          cp /tmp/recovered_code/UserPreferences.kt app/src/main/java/com/tuapp/tripadvisor/data/preferences/ 2>/dev/null || true
          cp /tmp/recovered_code/PreferencesRepository.kt app/src/main/java/com/tuapp/tripadvisor/data/preferences/ 2>/dev/null || true
          cp /tmp/recovered_code/OverlayService.kt app/src/main/java/com/tuapp/tripadvisor/service/overlay/ 2>/dev/null || true
          cp /tmp/recovered_code/RideAccessibilityService.kt app/src/main/java/com/tuapp/tripadvisor/service/accessibility/ 2>/dev/null || true
          cp /tmp/recovered_code/PermissionHelper.kt app/src/main/java/com/tuapp/tripadvisor/util/ 2>/dev/null || true
          cp /tmp/recovered_code/ScreenTextParser.kt app/src/main/java/com/tuapp/tripadvisor/util/ 2>/dev/null || true

      - name: Sobrescribir ConfigScreen.kt con sintaxis 100% limpia
        run: |
          cat << 'EOF' > app/src/main/java/com/tuapp/tripadvisor/ui/config/ConfigScreen.kt
          package com.tuapp.tripadvisor.ui.config

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.CheckCircle
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLifecycleOwner
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import com.tuapp.tripadvisor.service.overlay.OverlayService
          import com.tuapp.tripadvisor.util.PermissionHelper

          @Composable
          fun ConfigScreen(
              viewModel: ConfigViewModel,
              onServiceActivated: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current
              val state by viewModel.uiState.collectAsState()

              var showOverlayDialog by remember { mutableStateOf(false) }
              var showAccessibilityDialog by remember { mutableStateOf(false) }
              var awaitingSettingsReturn by remember { mutableStateOf(false) }

              fun attemptActivation() {
                  when {
                      !PermissionHelper.hasOverlayPermission(context) -> {
                          showOverlayDialog = true
                      }
                      !PermissionHelper.isAccessibilityServiceEnabled(context) -> {
                          showAccessibilityDialog = true
                      }
                      else -> {
                          viewModel.saveAndActivate(onSuccess = {
                              OverlayService.start(context)
                              onServiceActivated()
                          })
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME && awaitingSettingsReturn) {
                          awaitingSettingsReturn = false
                          attemptActivation()
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              Column(
                  modifier = modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(modifier = Modifier.height(24.dp))

                  Text("Configura tus tarifas", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Text(
                      text = "El semáforo usará estos valores como referencia mínima.",
                      fontSize = 14.sp,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.padding(top = 4.dp, bottom = 32.dp)
                  )

                  OutlinedTextField(
                      value = state.pricePerKmInput,
                      onValueChange = { viewModel.onPricePerKmChanged(it) },
                      label = { Text("Precio mínimo por km ($)") },
                      placeholder = { Text("Ej: 1.50") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  OutlinedTextField(
                      value = state.earningsPerHourInput,
                      onValueChange = { viewModel.onEarningsPerHourChanged(it) },
                      label = { Text("Ganancia mínima por hora ($)") },
                      placeholder = { Text("Ej: 25.00") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  state.errorMessage?.let { errorMsg ->
                      Text(
                          text = errorMsg,
                          color = MaterialTheme.colorScheme.error,
                          fontSize = 13.sp,
                          modifier = Modifier.padding(top = 12.dp)
                      )
                  }

                  if (state.saveSuccess) {
                      Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(top = 12.dp)) {
                          Icon(Icons.Filled.CheckCircle, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Preferencias guardadas — Servicio activo", fontSize = 13.sp)
                      }
                  }

                  Spacer(modifier = Modifier.height(32.dp))

                  Button(
                      onClick = { attemptActivation() },
                      enabled = !state.isSaving,
                      modifier = Modifier.fillMaxWidth().height(52.dp)
                  ) {
                      if (state.isSaving) {
                          CircularProgressIndicator(
                              modifier = Modifier.size(20.dp),
                              strokeWidth = 2.dp,
                              color = MaterialTheme.colorScheme.onPrimary
                          )
                      } else {
                          Text("Guardar y Activar Servicio", fontSize = 16.sp)
                      }
                  }
              }

              if (showOverlayDialog) {
                  OverlayPermissionDialog(
                      onConfirm = {
                          showOverlayDialog = false
                          awaitingSettingsReturn = true
                          context.startActivity(PermissionHelper.createOverlayPermissionIntent(context))
                      },
                      onDismiss = { showOverlayDialog = false }
                  )
              }

              if (showAccessibilityDialog) {
                  AccessibilityPermissionDialog(
                      onConfirm = {
                          showAccessibilityDialog = false
                          awaitingSettingsReturn = true
                          context.startActivity(PermissionHelper.createAccessibilitySettingsIntent())
                      },
                      onDismiss = { showAccessibilityDialog = false }
                  )
              }
          }
          EOF

      - name: Preparar Infraestructura de Gradle y Manifest
        run: |
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppUBER"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.tuapp.tripadvisor"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tuapp.tripadvisor"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Semáforo de Viajes</string>
              <string name="accessibility_service_description">Servicio para monitorear viajes de Uber</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.accessibility.RideAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".service.overlay.OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Otorgar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
